name: uzhai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0

  # Image Picker
  image_picker: ^1.1.2

  # Cloudinary
  cloudinary_public: ^0.23.1

  # HTTP
  http: ^1.2.2

  # Image Carousel
  carousel_slider: ^5.0.0

  # Full Screen Zoom
  photo_view: ^0.15.0

  # Audio Recording
  record: ^6.1.1

  # Audio Playback
  audioplayers: ^6.5.0

  just_audio: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/uzhai_logo.png